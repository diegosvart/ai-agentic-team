<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo HUD del CEO — Aster Consultores (simulación)</title>
<style>
/* ===== Tokens ===== */
:root{
  --bg0:#030b1a; --panel:rgba(5,20,46,.93); --panel-2:rgba(11,36,72,.92); --solid:#061834;
  --line:#2fd4f5; --line-dim:rgba(47,212,245,.40);
  --text:#e8f7ff; --dim:#a8c8dd; --accent:#35e0ff; --on-accent:#03121f; --focus:#ffffff;
  --ok:#5be3a4; --warn:#ffcf5c; --bad:#ff8f9c; --info:#8cc0ff;
  --cut:14px; --ease:cubic-bezier(.2,.75,.2,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shape:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  --hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg0);color:var(--text);font:15px/1.45 var(--font);overflow:hidden}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ===== Escena (oficina simulada) ===== */
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0d2a4f 0,#071a36 55%,#030b1a 100%)}
.scene-wrap{position:absolute;inset:0;transform-origin:50% 42%;transition:transform 800ms var(--ease),filter 800ms var(--ease)}
body.dolly .scene-wrap{transform:scale(.72) translateY(-3%);filter:saturate(.8) brightness(.75)}
.scene-box{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh*12/7));height:max(calc(100vw*7/12),100vh);transform:translate(-50%,-50%)}
.scene-box svg{position:absolute;inset:0;width:100%;height:100%}
.ceo-btn{position:absolute;left:50%;top:37%;width:8.5%;height:17%;transform:translate(-50%,-50%);background:transparent;border:0;padding:0;cursor:pointer}
.ceo-btn svg{position:static;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(53,224,255,.7))}
.ceo-btn .tag{position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:#03121f;border:1px solid var(--line);color:var(--accent);font:700 12px var(--mono);padding:1px 7px;letter-spacing:.12em}
.ceo-btn .pulse{position:absolute;left:50%;bottom:6%;width:150%;aspect-ratio:2/1;transform:translateX(-50%);border:2px solid var(--accent);border-radius:50%;animation:pulse 2.2s ease-out infinite;pointer-events:none}
.ceo-btn .tip{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:8px;white-space:nowrap;background:#03121f;border:1px solid var(--line);padding:4px 10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s}
.ceo-btn:hover .tip,.ceo-btn:focus-visible .tip{opacity:1}
@keyframes pulse{0%{opacity:.8;transform:translateX(-50%) scale(.6)}100%{opacity:0;transform:translateX(-50%) scale(1.15)}}
.demo-bar{position:fixed;left:12px;top:12px;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(3,14,32,.94);border:1px solid var(--line-dim);padding:8px 12px;font-size:13px;max-width:calc(100vw - 24px)}
.demo-bar strong{font-family:var(--mono);letter-spacing:.08em;color:var(--accent)}
.demo-bar label{display:flex;gap:8px;align-items:center;cursor:pointer}
.demo-bar input{width:18px;height:18px;accent-color:var(--accent)}

/* ===== HUD ===== */
.hud{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:108px minmax(0,1fr) 292px;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:18px 24px;background:radial-gradient(ellipse at 50% 45%,rgba(2,10,26,.12),rgba(2,8,22,.55) 90%)}
.topbar{grid-column:1/-1}
.rail{grid-column:1;grid-row:2/4}
.center{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-height:0}
.reqbar{grid-column:2;grid-row:3}
.side{grid-column:3;grid-row:2/4;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.hud-frame{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);pointer-events:none}
.hud-frame path,.rule path{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3000;stroke-dashoffset:0;vector-effect:non-scaling-stroke}

/* Panel con esquinas recortadas y línea fina */
.panel,.card,.btn{position:relative;isolation:isolate;clip-path:var(--shape)}
.panel{background:var(--panel);backdrop-filter:blur(8px)}
.card{--cut:10px;background:var(--panel-2)}
.panel::before,.card::before,.btn::before{content:"";position:absolute;inset:0;padding:1px;z-index:-1;pointer-events:none;background:var(--line-dim);clip-path:var(--shape);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.panel::after,.card::after,.btn::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom right,transparent calc(50% - .7px),var(--line-dim) calc(50% - .7px) calc(50% + .7px),transparent calc(50% + .7px)) top left/var(--cut) var(--cut) no-repeat,
  linear-gradient(to bottom right,transparent calc(50% - .7px),var(--line-dim) calc(50% - .7px) calc(50% + .7px),transparent calc(50% + .7px)) bottom right/var(--cut) var(--cut) no-repeat}
.panel{--cut:16px}

/* Barra superior */
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;min-height:58px}
.topbar h2{font-size:17px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.topbar h2:focus{outline:none}
.topbar .meta{color:var(--dim);font-size:13px}
.topbar .spacer{flex:1}
.sim{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--warn);color:var(--warn);padding:3px 10px;font:700 12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.sim i{width:8px;height:8px;background:var(--warn);border-radius:50%;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.rule{position:absolute;left:18px;right:18px;bottom:0;height:2px;pointer-events:none}

/* Botones */
.btn{min-height:40px;padding:9px 20px;border:0;background:rgba(13,54,102,.95);color:var(--text);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;--cut:9px}
.btn:hover{background:rgba(22,86,148,.98)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:-5px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:#7aeaff}
.btn-primary:focus-visible{outline-color:var(--on-accent)}
.btn-danger{background:rgba(96,18,38,.96);color:#ffd9de}
.btn-danger:hover{background:rgba(130,24,52,.98)}
.btn-ghost{background:rgba(8,30,62,.9)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.close-btn{min-width:44px;min-height:44px;padding:8px 14px}

/* Riel hexagonal */
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px}
.rail-title{font:700 11px var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.tab{position:relative;display:grid;justify-items:center;gap:5px;width:100%;padding:6px 2px;background:none;border:0;color:var(--dim);font-weight:600;font-size:12px;cursor:pointer;text-align:center}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.hex{position:relative;isolation:isolate;display:grid;place-items:center;width:52px;height:58px;background:var(--line);clip-path:var(--hex);font:700 16px var(--mono);color:var(--accent);transition:background .15s}
.hex::before{content:"";position:absolute;inset:1.5px;z-index:-1;background:var(--solid);clip-path:var(--hex);transition:background .15s}
.tab:hover .hex::before{background:#0d3566}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"] .hex{background:var(--accent);color:var(--on-accent)}
.tab[aria-selected="true"] .hex::before{background:var(--accent)}
.cnt{position:absolute;top:0;right:8px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;background:var(--warn);color:#2a1d00;font:700 12px var(--mono);border-radius:3px}

/* Módulos */
.tabpanel{flex:1;min-height:0;overflow:auto;padding:20px 22px;scrollbar-color:var(--line) transparent}
.tabpanel:focus-visible{outline:2px solid var(--focus);outline-offset:-4px}
.mod-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.mod-head .num{font:700 30px/1 var(--mono);color:var(--accent)}
.mod-head h3{font-size:20px;letter-spacing:.04em}
.mod-head p{color:var(--dim);font-size:13px}
.mod-head .grow{flex:1;min-width:200px}
.mod-head h3:focus{outline:none}
.grid{display:grid;gap:12px}
.grid.cols{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{padding:14px 16px}
.card h4{font-size:15px;display:flex;gap:10px;align-items:baseline}
.card .n{font:700 13px var(--mono);color:var(--accent)}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{min-height:34px;padding:5px 14px;border:1px solid var(--line-dim);background:rgba(8,30,62,.9);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;border-radius:2px}
.chip:hover{background:rgba(22,86,148,.9)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border:1px solid currentColor;background:rgba(0,0,0,.28);font-size:12px;font-weight:600;white-space:nowrap;color:var(--dim)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-info{color:var(--info)}.t-acc{color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.tasks{margin-top:10px;border-top:1px solid var(--line-dim);padding-top:8px}
.tasks li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0}
.kv dt{color:var(--dim)}.kv dd{margin:0}
.area-card{display:flex;flex-direction:column;gap:8px}
.spark{display:block;width:100%;height:30px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark path{fill:rgba(53,224,255,.14);stroke:none}
.back{margin-bottom:12px}

/* Checklist */
.progress{height:8px;background:rgba(47,212,245,.18);margin:6px 0 16px;position:relative;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .3s var(--ease)}
.group-title{font:700 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check label{flex:1;cursor:pointer}
.check input:checked + label{color:var(--dim);text-decoration:line-through}
.check input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Árbol */
.tree,.tree ul{list-style:none}
.tree ul{margin:8px 0 0 18px;padding-left:14px;border-left:1px solid var(--line-dim)}
.tree li{margin:6px 0}
.node{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:rgba(10,34,70,.9);border:1px solid var(--line-dim)}
.node .ttl{flex:1;min-width:160px}
.toggle{width:30px;height:30px;display:grid;place-items:center;background:none;border:1px solid var(--line-dim);color:var(--accent);cursor:pointer;font-weight:700}
.toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* Aprobaciones */
.run{padding:14px 16px}
.params{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:6px 0 10px}
.params b{color:var(--text);font-weight:600}
.note-label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
textarea,.input{width:100%;background:#041126;border:1px solid var(--line-dim);color:var(--text);padding:8px 10px;border-radius:2px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.run .actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line-dim)}
.empty:focus{outline:none}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid rgba(47,212,245,.18)}
.hist .sub{grid-column:1/-1;font-size:13px;color:var(--dim)}

/* Gauges */
.side .panel{padding:14px 16px}
.side h3{font:700 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.gauges{display:grid;gap:12px}
.gauges li{display:flex;gap:14px;align-items:center}
.gauge{position:relative;width:76px;height:76px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{fill:none;stroke:rgba(47,212,245,.22);stroke-width:6}
.gauge .arc{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:butt;transition:stroke-dashoffset .6s var(--ease)}
.gauge .ticks{fill:none;stroke:var(--line-dim);stroke-width:2;stroke-dasharray:1.5 5.5}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--mono)}
.g-lab{font-weight:700;font-size:14px}
.g-sub{font-size:13px;color:var(--dim)}

/* Barra de solicitud */
.reqbar{padding:10px 14px}
.reqbar{display:flex;gap:12px;align-items:flex-end}
.reqbar textarea{height:44px;min-height:44px;resize:none}

/* Animaciones de ensamblado */
.hud[data-state="opening"] .panel{animation:panelIn .6s var(--ease) both;animation-delay:calc(var(--i)*80ms)}
.hud[data-state="opening"] .hud-frame path,.hud[data-state="opening"] .rule path{animation:draw .9s var(--ease) both;animation-delay:.25s}
.hud[data-state="opening"]{animation:veil .5s ease both}
.hud[data-state="closing"] .panel{animation:panelOut .28s ease-in both;animation-delay:calc((4 - var(--i))*40ms)}
.hud[data-state="closing"]{animation:veil .46s ease reverse both}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes panelOut{to{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes draw{from{stroke-dashoffset:3000}to{stroke-dashoffset:0}}
@keyframes veil{from{background-color:transparent;opacity:.0}to{opacity:1}}

/* Movimiento reducido: sin dolly, sin dibujo de líneas, sin pulsos; fundido <=150 ms */
html.rm .scene-wrap{transition:none}
html.rm .ceo-btn .pulse,html.rm .sim i{animation:none}
html.rm .hud .panel,html.rm .hud .hud-frame path,html.rm .hud .rule path{animation:none!important}
html.rm .hud[data-state]{animation:rmfade .12s linear both!important}
html.rm .gauge .arc,html.rm .progress i{transition:none}
@keyframes rmfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .scene-wrap{transition:none}
  .ceo-btn .pulse,.sim i{animation:none}
  .hud .panel,.hud .hud-frame path,.hud .rule path{animation:none!important}
  .hud[data-state]{animation:rmfade .12s linear both!important}
  .gauge .arc,.progress i{transition:none}
}

/* Móvil: riel como barra inferior, gauges apilados sobre el módulo */
@media (max-width:860px){
  .hud{display:flex;flex-direction:column;gap:10px;padding:8px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .hud>*{flex-shrink:0}
  .topbar{order:0;flex-wrap:wrap;gap:8px;padding:8px 12px;min-height:0;position:sticky;top:0;z-index:3}
  .topbar .meta{display:none}
  .topbar h2{font-size:14px}
  .side{order:1;overflow:visible;flex:none}
  .center{order:2;flex:none}
  .tabpanel{overflow:visible;padding:14px 12px}
  .reqbar{order:3}
  .rail{order:4;flex-direction:row;justify-content:space-around;gap:0;padding:6px 2px;position:sticky;bottom:0;z-index:3}
  .rail-title{display:none}
  .tab{width:auto;flex:1;min-width:0;padding:4px 0}
  .hex{width:40px;height:45px;font-size:14px}
  .cnt{right:50%;margin-right:-26px}
  .gauges{grid-template-columns:1fr 1fr}
  .gauges li{gap:8px}
  .gauge{width:52px;height:52px}
  .gauge .val{font-size:15px}
  .g-lab{font-size:13px;line-height:1.2}.g-sub{font-size:12px}
  .side .panel{padding:10px 12px}
  .spark-panel{display:none}
  .reqbar{flex-direction:column;align-items:stretch}
  .btn{min-height:44px}
  .chip{min-height:40px}
  .demo-bar{font-size:12px}
}

/* Colores forzados (Windows Alto Contraste) */
@media (forced-colors:active){
  .hud{background:Canvas}
  .panel,.card,.btn{clip-path:none;border:1px solid CanvasText;background:Canvas}
  .panel::before,.panel::after,.card::before,.card::after,.btn::before,.btn::after,.hex::before{display:none}
  .hex{clip-path:none;background:Canvas;border:2px solid CanvasText;border-radius:8px}
  .tab[aria-selected="true"] .hex{background:Highlight;color:HighlightText;border-color:Highlight;forced-color-adjust:none}
  .tab[aria-selected="true"]{outline:2px solid Highlight}
  .chip[aria-pressed="true"]{background:Highlight;color:HighlightText;forced-color-adjust:none}
  .btn-primary{background:ButtonFace;color:ButtonText;border:2px solid Highlight}
  .gauge .trk{stroke:GrayText}.gauge .arc{stroke:Highlight}.gauge .ticks{stroke:CanvasText}
  .progress{background:Canvas;border:1px solid CanvasText;clip-path:none}.progress i{background:Highlight}
  .hud-frame path,.rule path{stroke:CanvasText}
  .spark polyline{stroke:CanvasText}.spark path{fill:none}
  .badge,.sim{border:1px solid CanvasText;color:CanvasText}
  .cnt{background:Highlight;color:HighlightText;forced-color-adjust:none}
  .dot{forced-color-adjust:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="demo-bar">
    <strong>PROTOTIPO H-01</strong>
    <span>Oficina simulada · pulsa al CEO para abrir el centro de mando</span>
    <label><input type="checkbox" id="rmSwitch" role="switch"> Movimiento reducido (simulado)</label>
  </header>
  <main class="scene-wrap" id="sceneWrap">
    <h1 class="sr-only">Oficina de Aster Consultores (simulación)</h1>
    <div class="scene-box">
      <svg id="office" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"></svg>
      <button type="button" class="ceo-btn" id="ceoBtn" aria-label="CEO — abrir centro de mando" aria-haspopup="dialog">
        <span class="pulse" aria-hidden="true"></span>
        <svg viewBox="0 0 60 100" aria-hidden="true" focusable="false">
          <ellipse cx="30" cy="94" rx="22" ry="5" fill="rgba(0,0,0,.35)"/>
          <path d="M12 90 V58 q0-14 18-14 q18 0 18 14 V90 z" fill="#7fb2ff" stroke="#e8f7ff" stroke-width="2"/>
          <path d="M26 46 L30 62 L34 46" fill="#e8f7ff"/>
          <circle cx="30" cy="30" r="14" fill="#f0d3b6" stroke="#e8f7ff" stroke-width="2"/>
          <path d="M16 28 q2-16 14-16 q12 0 14 16 q-8-8-28 0z" fill="#16335c"/>
        </svg>
        <span class="tag" aria-hidden="true">CEO</span>
        <span class="tip" aria-hidden="true">Abrir centro de mando</span>
      </button>
    </div>
  </main>
</div>

<div id="livePage" class="sr-only" role="status" aria-live="polite"></div>

<div id="hud" class="hud" role="dialog" aria-modal="true" aria-labelledby="hud-title" hidden data-state="closed">
  <svg class="hud-frame" aria-hidden="true" focusable="false" preserveAspectRatio="none" viewBox="0 0 100 100">
    <path pathLength="1" d="M0 6 V0 H6"/><path pathLength="1" d="M94 0 H100 V6"/><path pathLength="1" d="M100 94 V100 H94"/><path pathLength="1" d="M6 100 H0 V94"/>
  </svg>

  <header class="panel topbar" style="--i:0">
    <h2 id="hud-title" tabindex="-1">Centro de mando · Aster Consultores</h2>
    <span class="meta" id="hudDate"></span>
    <span class="spacer"></span>
    <span class="sim"><i aria-hidden="true"></i>Simulación</span>
    <button type="button" class="btn close-btn" id="closeBtn" aria-label="Cerrar centro de mando">Cerrar <span aria-hidden="true">✕</span></button>

  $('#tablist').innerHTML=MODS.map(function(m,i){return '<button type="button" role="tab" class="tab" id="tab-'+i+'" aria-controls="panel-'+i+'" aria-selected="'+(i===active)+'" tabindex="'+(i===active?0:-1)+'" aria-keyshortcuts="'+(i+1)+'" title="'+m[2]+' (tecla '+(i+1)+')"><span class="hex">'+m[0]+'</span><span>'+m[1]+'</span>'+(i===4?'<span class="cnt" id="cnt-5" aria-hidden="true"></span><span class="sr-only" id="cnt-5t"></span>':'')+'</button>';}).join('');
  $('#panels').innerHTML=MODS.map(function(m,i){return '<div role="tabpanel" class="tabpanel" id="panel-'+i+'" aria-labelledby="tab-'+i+'" tabindex="0"'+(i===active?'':' hidden')+'></div>';}).join('');
}
function selectTab(i,focus,silent){
  active=i;
  $$('.tab').forEach(function(b,j){b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1;});
  $$('.tabpanel').forEach(function(p,j){p.hidden=j!==i;});
  renderMod(i);
  if(focus)$('#tab-'+i).focus();
  if(!silent)announce('Módulo '+(i+1)+' de 5: '+MODS[i][2]);
}
function renderMod(i){[renderProc,renderAreas,renderDay,renderTasks,renderRuns][i]();}
function head(i,sub,extra){return '<div class="mod-head"><span class="num" aria-hidden="true">'+MODS[i][0]+'</span><div class="grow"><h3 tabindex="-1" id="h-'+i+'">'+MODS[i][2]+'</h3><p>'+sub+'</p></div>'+(extra||'')+'</div>';}
function badge(map,k){var m=map[k];return '<span class="badge '+m[1]+'"><span aria-hidden="true">'+m[2]+'</span>'+m[0]+'</span>';}
function spark(seed){var v=[],x=seed*7+3;for(var i=0;i<10;i++){x=(x*37+11)%23;v.push(4+x%14);}var p=v.map(function(y,i){return (i*100/9).toFixed(1)+','+(24-y).toFixed(1)});return '<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0,26 L'+p.join(' L')+' L100,26z"/><polyline points="'+p.join(' ')+'"/></svg>';}

/* 01 Procesos */
function renderProc(){
  var el=$('#panel-0');
  var list=PROC.filter(function(p){return procArea==='all'||p[0]===procArea});
  el.innerHTML=head(0,'Procesos de cada área y sus tareas recurrentes ('+list.length+' de '+PROC.length+').')+
   '<div class="chips" role="group" aria-label="Filtrar por área"><button type="button" class="chip" data-k="all" aria-pressed="'+(procArea==='all')+'">Todas</button>'+
   AREAS.map(function(a){return '<button type="button" class="chip" data-k="'+a.k+'" aria-pressed="'+(procArea===a.k)+'">'+esc(a.n)+'</button>';}).join('')+'</div>'+
   '<ul class="grid cols">'+list.map(function(p,i){var a=area(p[0]);return '<li class="card"><h4><span class="n">'+String(i+1).padStart(2,'0')+'</span>'+esc(p[1])+'</h4><div class="row small muted" style="margin-top:4px"><span class="dot" style="background:'+a.c+'" aria-hidden="true"></span>'+esc(a.n)+' · '+esc(a.ag)+'</div><div class="row" style="margin-top:8px"><span class="badge t-acc">'+p[2]+'</span><span class="small muted">Próxima: '+p[3]+'</span></div><ul class="tasks" aria-label="Tareas recurrentes de '+esc(p[1])+'">'+p[4].map(function(t){return '<li><span>'+esc(t[0])+'</span><span class="muted">'+t[1]+'</span></li>';}).join('')+'</ul></li>';}).join('')+'</ul>';
  $$('.chip',el).forEach(function(b){b.onclick=function(){procArea=b.dataset.k;renderProc();$('.chip[data-k="'+procArea+'"]',el).focus();announce('Filtro: '+(procArea==='all'?'todas las áreas':area(procArea).n)+'. '+PROC.filter(function(p){return procArea==='all'||p[0]===procArea}).length+' procesos.');};});
}

/* 02 Áreas */
function stub(what){announce('Prototipo: aquí se abriría el formulario para '+what+'.');}
function renderAreas(){
  var el=$('#panel-1');
  if(openArea){return renderFicha(el,area(openArea));}
  el.innerHTML=head(1,'Cada área con su agente a cargo y su estado. Abre un área para ver la ficha y sus acciones.','<button type="button" class="btn btn-primary btn-sm" id="newAgent">Nuevo agente</button>')+
   '<ul class="grid cols">'+AREAS.map(function(a,i){var n=TASKS.filter(function(t){return t.a===a.k&&t.p&&['queued','planning','running','waiting_approval'].indexOf(t.s)>=0}).length;return '<li class="card area-card"><h4><span class="n">'+String(i+1).padStart(2,'0')+'</span>'+esc(a.n)+'</h4><div class="row"><span class="dot" style="background:'+a.c+'" aria-hidden="true"></span><strong>'+esc(a.ag)+'</strong><span class="muted small">'+a.role+' · '+a.model+'</span></div><div class="row">'+badge(AG_ST,a.st)+'<span class="small muted">'+n+(n===1?' tarea activa':' tareas activas')+'</span></div>'+spark(i+1)+'<button type="button" class="btn btn-sm btn-ghost" data-area="'+a.k+'" aria-label="Abrir área '+esc(a.n)+', agente '+esc(a.ag)+'">Abrir área</button></li>';}).join('')+'</ul>';
  $('#newAgent').onclick=function(){stub('crear un agente');};
  $$('[data-area]',el).forEach(function(b){b.onclick=function(){openArea=b.dataset.area;renderAreas();$('#h-1').focus();announce('Ficha de '+area(openArea).n+', agente '+area(openArea).ag+'.');};});
}
function renderFicha(el,a){
  var tasks=TASKS.filter(function(t){return t.a===a.k}).slice(0,4), runs=RUNS.filter(function(r){return r.a===a.k}).slice(0,3);
  el.innerHTML='<button type="button" class="btn btn-sm btn-ghost back" id="backBtn"><span aria-hidden="true">←</span> Volver a las áreas</button>'+
   head(1,esc(a.n)+' · '+a.role,'<div class="row"><button type="button" class="btn btn-sm" id="editAgent">Editar agente</button><button type="button" class="btn btn-sm btn-danger" id="delAgent" disabled title="Ejemplo de estado deshabilitado">Borrar agente</button></div>').replace('<h3 tabindex="-1" id="h-1">'+MODS[1][2]+'</h3>','<h3 tabindex="-1" id="h-1"><span class="dot" style="background:'+a.c+';display:inline-block;margin-right:8px" aria-hidden="true"></span>Ficha: '+esc(a.ag)+'</h3>')+
   '<div class="card"><dl class="kv"><dt>Área</dt><dd>'+esc(a.n)+'</dd><dt>Estado</dt><dd>'+badge(AG_ST,a.st)+'</dd><dt>Modelo</dt><dd>'+a.model+' (por defecto)</dd><dt>Clave</dt><dd><code>'+a.k+'</code></dd></dl><p>'+esc(a.d)+'</p></div>'+
   '<div class="mod-head" style="margin-top:20px"><div class="grow"><h4 style="font-size:16px">Acciones ('+a.acts.length+')</h4></div><button type="button" class="btn btn-primary btn-sm" id="newAction">Nueva acción</button></div>'+
   '<ul class="grid">'+a.acts.map(function(x){return '<li class="card"><div class="row between"><strong>'+esc(x[0])+'</strong><span class="row">'+(x[2]?'<span class="badge t-warn">Requiere aprobación</span>':'')+(x[3]?'<span class="badge t-ok">Habilitada</span>':'<span class="badge">Deshabilitada</span>')+'</span></div><p class="small muted"><code>'+x[1]+'</code> · conector: '+esc(x[4])+'</p><div class="row" style="margin-top:8px"><button type="button" class="btn btn-sm btn-ghost" data-edit="'+esc(x[0])+'" aria-label="Editar acción '+esc(x[0])+'">Editar</button><button type="button" class="btn btn-sm btn-ghost" data-del="'+esc(x[0])+'" aria-label="Borrar acción '+esc(x[0])+'">Borrar</button></div></li>';}).join('')+'</ul>'+
   '<h4 style="font-size:16px;margin:20px 0 8px">Actividad reciente</h4><ul class="hist">'+tasks.map(function(t){return '<li><span>'+esc(t.t)+'</span>'+badge(T_ST,t.s)+'</li>';}).join('')+runs.map(function(r){return '<li><span>Ejecución: '+esc(r.n)+'</span>'+badge(R_ST,r.s)+'</li>';}).join('')+'</ul>';
  $('#backBtn').onclick=function(){var k=openArea;openArea=null;renderAreas();$('[data-area="'+k+'"]').focus();announce('Volviste a la lista de áreas.');};
  $('#editAgent').onclick=function(){stub('editar a '+a.ag);};
  $('#newAction').onclick=function(){stub('crear una acción para '+a.ag);};
  $$('[data-edit]',el).forEach(function(b){b.onclick=function(){stub('editar la acción '+b.dataset.edit);};});
  $$('[data-del]',el).forEach(function(b){b.onclick=function(){stub('confirmar el borrado de la acción '+b.dataset.del);};});
}

/* 03 Mi día (vista de agenda: estados AgendaStatus, SPEC modelo de procesos 3 y 5.4) */
function renderDay(){
  var el=$('#panel-2'),m=metrics(),done=AGENDA.filter(function(a){return a[3]==='done'||a[3]==='skipped'}).length;
  function row(a,i){var can=a[3]==='due'||a[3]==='missed';return '<li class="card check" style="align-items:center"><span class="n t-acc" style="font:700 13px var(--mono)">'+String(i+1).padStart(2,'0')+'</span><span style="flex:1"><strong>'+esc(a[1])+'</strong><span class="small muted"> · '+a[0]+' · '+a[2]+'</span></span>'+badge(AG_ST2,a[3])+(can?'<button type="button" class="btn btn-sm btn-ghost" data-run="'+a[0]+'" aria-label="Lanzar ahora '+esc(a[1])+'">Lanzar ahora</button>':'')+'</li>';}
  var late=AGENDA.filter(function(a){return a[4]}),today=AGENDA.filter(function(a){return !a[4]});
  el.innerHTML=head(2,'La agenda del CEO: tareas recurrentes R-DIR con su estado. Las automáticas las lanza el sistema; las manuales, tú.')+
   '<div class="small" id="dayTxt">'+done+' de '+AGENDA.length+' resueltas</div><div class="progress" aria-hidden="true"><i id="dayBar" style="width:'+(done*100/AGENDA.length)+'%"></i></div>'+
   '<h4 class="group-title">Atrasadas</h4><ul class="grid">'+late.map(row).join('')+'</ul>'+
   '<h4 class="group-title">Hoy</h4><ul class="grid">'+today.map(function(a,i){return row(a,i)}).join('')+'</ul>'+
   '<h4 class="group-title">Ejecuciones</h4><ul class="grid"><li class="card check" style="align-items:center"><span style="flex:1">Aprobar ejecuciones pendientes: <strong id="dayPend">'+m.pend+'</strong></span><button type="button" class="btn btn-sm btn-primary" id="goRuns">Ir a aprobaciones</button></li></ul>';
  $$('[data-run]',el).forEach(function(b){b.onclick=function(){var a=AGENDA.filter(function(x){return x[0]===b.dataset.run})[0];a[3]='running';renderDay();$('#h-2').focus();announce('Lanzada: '+a[1]+'. Estado: en curso.');};});
  $('#goRuns').onclick=function(){selectTab(4,true);};
}

/* 04 Tareas de los agentes */
function renderTasks(){
  var el=$('#panel-3');
  var roots=TASKS.filter(function(t){return !t.p});
  el.innerHTML=head(3,'Cada solicitud al CEO y las subtareas delegadas a los agentes, con su estado.')+
   '<div class="legend" role="group" aria-label="Leyenda de estados">'+Object.keys(T_ST).map(function(k){return badge(T_ST,k)}).join('')+'</div>'+
   '<ul class="tree">'+roots.map(function(r,i){
     var ch=TASKS.filter(function(t){return t.p===r.id});
     return '<li><div class="node"><button type="button" class="toggle" data-id="'+r.id+'" aria-expanded="'+!!expanded[r.id]+'" aria-controls="sub-'+r.id+'" aria-label="Subtareas de '+esc(r.t)+'"><span aria-hidden="true">'+(expanded[r.id]?'−':'+')+'</span></button><span class="n t-acc" style="font:700 13px var(--mono)">'+String(i+1).padStart(2,'0')+'</span><strong class="ttl">'+esc(r.t)+'</strong><span class="small muted">'+ch.length+' subtareas</span>'+badge(T_ST,r.s)+'</div>'+
      '<ul id="sub-'+r.id+'"'+(expanded[r.id]?'':' hidden')+'>'+ch.map(function(c){var a=area(c.a);var rr=RUNS.filter(function(x){return x.tk===c.id});return '<li><div class="node"><span class="dot" style="background:'+a.c+'" aria-hidden="true"></span><span class="ttl">'+esc(c.t)+'<span class="small muted"> · '+esc(a.ag)+' ('+esc(a.n)+')</span>'+(rr.length?'<span class="small muted"> · '+rr.map(function(x){return esc(x.n)+': '+R_ST[x.s][0].toLowerCase()}).join('; ')+'</span>':'')+'</span>'+badge(T_ST,c.s)+'</div></li>';}).join('')+'</ul></li>';}).join('')+'</ul>';
  $$('.toggle',el).forEach(function(b){b.onclick=function(){var id=b.dataset.id;expanded[id]=!expanded[id];b.setAttribute('aria-expanded',!!expanded[id]);b.firstChild.textContent=expanded[id]?'−':'+';$('#sub-'+id).hidden=!expanded[id];};});
}

/* 05 Ejecuciones y aprobaciones */
function renderRuns(focusNext){
  var el=$('#panel-4'),pend=RUNS.filter(function(r){return r.s==='pending_approval'}),hist=RUNS.filter(function(r){return r.s!=='pending_approval'}).sort(function(a,b){return b.at<a.at?-1:1});
  el.innerHTML=head(4,'Bandeja de aprobaciones e historial de ejecuciones de hoy.')+
   '<h4 class="group-title" id="inboxT" tabindex="-1" style="margin-top:0">Bandeja · '+pend.length+(pend.length===1?' pendiente':' pendientes')+'</h4>'+
   (pend.length?'<ul class="grid">'+pend.map(function(r,i){var a=area(r.a);return '<li class="card run" data-id="'+r.id+'"><h4><span class="n">'+String(i+1).padStart(2,'0')+'</span><span id="rt-'+r.id+'">'+esc(r.n)+'</span></h4><div class="row small muted"><span class="dot" style="background:'+a.c+'" aria-hidden="true"></span>'+esc(a.ag)+' · '+esc(a.n)+' · solicitada a las '+r.at+'</div><div class="params">'+Object.keys(r.pr).map(function(k){return '<span>'+esc(k)+': <b>'+esc(r.pr[k])+'</b></span>';}).join('')+'</div><label class="note-label" for="note-'+r.id+'">'+(r.reqNote?'Nota (obligatoria para aprobar, política '+r.pol+')':'Nota (opcional)')+'</label><textarea id="note-'+r.id+'" rows="2" placeholder="Se la entregamos al agente"'+(r.reqNote?' aria-required="true"':'')+' aria-describedby="err-'+r.id+'"></textarea><p class="small t-bad" id="err-'+r.id+'" role="alert" hidden>Esta ejecución exige una nota para aprobarla (la API respondería 400). Puedes rechazar sin nota.</p><div class="actions"><button type="button" class="btn btn-primary btn-sm" data-ok="'+r.id+'" aria-label="Aprobar '+esc(r.n)+'">Aprobar</button><button type="button" class="btn btn-danger btn-sm" data-no="'+r.id+'" aria-label="Rechazar '+esc(r.n)+'">Rechazar</button></div></li>';}).join('')+'</ul>':'<p class="empty" id="emptyInbox" tabindex="-1">No hay ejecuciones pendientes. Buen trabajo.</p>')+
   '<h4 class="group-title">Historial de hoy</h4><ul class="hist">'+hist.map(function(r){return '<li><span><strong>'+esc(r.n)+'</strong> · '+esc(area(r.a).ag)+' · '+r.at+'</span>'+badge(R_ST,r.s)+(r.err?'<span class="sub">Error: '+esc(r.err)+'</span>':'')+(r.note?'<span class="sub">Nota: '+esc(r.note)+'</span>':'')+'</li>';}).join('')+'</ul>';
  $$('[data-ok]',el).forEach(function(b){b.onclick=function(){resolve(b.dataset.ok,true);};});
  $$('[data-no]',el).forEach(function(b){b.onclick=function(){resolve(b.dataset.no,false);};});
}
function resolve(id,ok){
  var r=RUNS.filter(function(x){return x.id===id})[0],note=$('#note-'+id).value.trim(),idx=RUNS.filter(function(x){return x.s==='pending_approval'}).indexOf(r);
  if(ok&&r.reqNote&&!note){var er=$('#err-'+id),ta=$('#note-'+id);er.hidden=false;ta.setAttribute('aria-invalid','true');ta.focus();announce('No se puede aprobar sin nota: la política '+r.pol+' la exige.');return;}
  r.s=ok?'succeeded':'rejected';r.note=note;r.at=new Date().toTimeString().slice(0,5);
  var t=TASKS.filter(function(x){return x.id===r.tk})[0];if(t)t.s=ok?'completed':'failed';
  var ag=area(r.a);if(ag&&!RUNS.some(function(x){return x.a===r.a&&x.s==='pending_approval'})&&ag.st==='waiting_approval')ag.st=ok?'working':'idle';
  renderRuns();updateGauges();
  var m=metrics(),left=$$('#panel-4 .run');
  if(left.length){var nx=left[Math.min(idx,left.length-1)];$('textarea',nx).focus();}else{$('#emptyInbox').focus();}
  announce((ok?'Aprobada: ':'Rechazada: ')+r.n+(note?' con nota.':'.')+' Quedan '+m.pend+(m.pend===1?' aprobación pendiente.':' aprobaciones pendientes.'));
}

/* ===== Solicitud al CEO ===== */
var rq=$('#reqText');
$('#reqForm').addEventListener('submit',function(e){
  e.preventDefault();var v=rq.value.trim();if(!v)return;
  TASKS.push({id:'n'+TASKS.length,p:null,a:'direccion',t:v,s:'planning'});rq.value='';updateGauges();
  if(active===3)renderTasks();
  announce('Solicitud enviada al CEO: '+v+'. Aparece en Tareas de los agentes.');
});
rq.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#reqForm').requestSubmit();}});

/* ===== Abrir / cerrar con transición ===== */
function open(){
  if(state!=='closed')return;
  state='dolly';trigger=ceo;app.inert=true;
  var rm=reduced();
  if(rm)show(rm);else{document.body.classList.add('dolly');T(function(){show(rm);},780);}
}
function show(rm){
  state='opening';hud.hidden=false;hud.dataset.state='opening';
  selectTab(active,false,true);
  $('#tab-'+active).focus({preventScroll:true});
  announce('Centro de mando abierto. Módulo '+(active+1)+' de 5: '+MODS[active][2]+'. Usa las flechas para cambiar de módulo y Escape para cerrar.');
  T(function(){state='open';hud.dataset.state='open';},rm?130:1000);
}
function close(){
  if(state!=='open'&&state!=='opening')return;
  var rm=reduced();state='closing';timers.forEach(clearTimeout);timers=[];hud.dataset.state='closing';
  if(rm)finish();else T(finish,470);
}
function finish(){
  hud.hidden=true;hud.dataset.state='closed';app.inert=false;state='closed';
  document.body.classList.remove('dolly');
  (trigger||ceo).focus({preventScroll:true});
  announce('Centro de mando cerrado. Volviste a la oficina.',true);
}
ceo.addEventListener('click',open);
$('#closeBtn').addEventListener('click',close);

hud.addEventListener('keydown',function(e){
  if(e.key==='Escape'){e.preventDefault();close();return;}
  if(e.key==='Tab'){
    var f=$$('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),[tabindex="0"]',hud).filter(function(x){return x.getClientRects().length&&!x.closest('[hidden]')});
    if(!f.length)return;var first=f[0],last=f[f.length-1],cur=document.activeElement;
    if(e.shiftKey&&(cur===first||!hud.contains(cur))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(cur===last||!hud.contains(cur))){e.preventDefault();first.focus();}
    return;
  }
  var tg=e.target,editable=tg.tagName==='TEXTAREA'||tg.tagName==='INPUT'&&tg.type!=='checkbox'||tg.isContentEditable;
  if(!editable&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1-5]$/.test(e.key)){e.preventDefault();selectTab(+e.key-1,true);}
});
$('#tablist').addEventListener('keydown',function(e){
  var k=e.key,n=MODS.length,i=active,to=null;
  if(k==='ArrowDown'||k==='ArrowRight')to=(i+1)%n;
  else if(k==='ArrowUp'||k==='ArrowLeft')to=(i-1+n)%n;
  else if(k==='Home')to=0;else if(k==='End')to=n-1;
  if(to!==null){e.preventDefault();selectTab(to,true);}
});
$('#tablist').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)selectTab(+b.id.slice(4),true);});
var mqM=window.matchMedia('(max-width:860px)');
function orient(){$('#tablist').setAttribute('aria-orientation',mqM.matches?'horizontal':'vertical');}
orient();mqM.addEventListener&&mqM.addEventListener('change',orient);

$('#hudDate').textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
buildTabs();buildGauges();selectTab(0,false,true);
})();
</script>
