<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo HUD del CEO — Aster Consultores (simulación)</title>
<style>
/* ===== Tokens ===== */
:root{
  --bg0:#030b1a; --panel:rgba(5,20,46,.78); --panel-2:rgba(11,36,72,.95); --solid:#061834;
  --line:#2fd4f5; --line-dim:rgba(47,212,245,.40);
  --text:#e8f7ff; --dim:#a8c8dd; --accent:#35e0ff; --on-accent:#03121f; --focus:#ffffff;
  --ok:#5be3a4; --warn:#ffcf5c; --bad:#ff8f9c; --info:#8cc0ff;
  --cut:14px; --ease:cubic-bezier(.2,.75,.2,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shape:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  --hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg0);color:var(--text);font:15px/1.45 var(--font);overflow:hidden}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ===== Escena (oficina simulada) ===== */
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0d2a4f 0,#071a36 55%,#030b1a 100%)}
.scene-wrap{position:absolute;inset:0;transform-origin:50% 42%;transition:transform 800ms var(--ease),filter 800ms var(--ease)}
body.dolly .scene-wrap{transform:translate(-6%,-17.5%) scale(.68);filter:saturate(.9) brightness(.9)}
body.hud-open .demo-bar{visibility:hidden}
.scene-box{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh*12/7));height:max(calc(100vw*7/12),100vh);transform:translate(-50%,-50%)}
.scene-box svg{position:absolute;inset:0;width:100%;height:100%}
.ceo-btn{position:absolute;left:50%;top:37%;width:8.5%;height:17%;transform:translate(-50%,-50%);background:transparent;border:0;padding:0;cursor:pointer}
.ceo-btn svg{position:static;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(53,224,255,.7))}
.ceo-btn .tag{position:absolute;left:50%;top:-4px;transform:translateX(-50%);background:#03121f;border:1px solid var(--line);color:var(--accent);font:700 12px var(--mono);padding:1px 7px;letter-spacing:.12em}
.ceo-btn .pulse{position:absolute;left:50%;bottom:6%;width:150%;aspect-ratio:2/1;transform:translateX(-50%);border:2px solid var(--accent);border-radius:50%;animation:pulse 2.2s ease-out infinite;pointer-events:none}
.ceo-btn .tip{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:8px;white-space:nowrap;background:#03121f;border:1px solid var(--line);padding:4px 10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s}
.ceo-btn:hover .tip,.ceo-btn:focus-visible .tip{opacity:1}
@keyframes pulse{0%{opacity:.8;transform:translateX(-50%) scale(.6)}100%{opacity:0;transform:translateX(-50%) scale(1.15)}}
.demo-bar{position:fixed;left:12px;top:12px;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(3,14,32,.94);border:1px solid var(--line-dim);padding:8px 12px;font-size:13px;max-width:calc(100vw - 24px)}
.demo-bar strong{font-family:var(--mono);letter-spacing:.08em;color:var(--accent)}
.demo-bar label{display:flex;gap:8px;align-items:center;cursor:pointer}
.demo-bar input{width:18px;height:18px;accent-color:var(--accent)}
.badge.lock{color:var(--warn)}
.tasks li .code,.code{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sec-title{font-size:16px;margin:20px 0 8px}
.agent-grid{display:grid;gap:12px}
.note-row{overflow-wrap:anywhere}

/* ===== HUD ===== */
.hud{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:108px minmax(0,1fr) 292px;grid-template-rows:auto minmax(120px,22vh) minmax(0,1fr) auto;gap:14px;padding:18px 24px;background:radial-gradient(ellipse at 44% 22%,rgba(2,10,26,0) 0,rgba(2,10,26,.10) 25%,rgba(2,8,22,.5) 90%)}
.topbar{grid-column:1/-1}
.rail{grid-column:1;grid-row:2/5}
.window{grid-column:2;grid-row:2;position:relative;pointer-events:none}
.window i{position:absolute;width:26px;height:26px;border:2px solid var(--accent)}
.window i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.window i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.window i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.window i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.window b{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:var(--solid);border:1px solid var(--line-dim);color:var(--dim);font:700 11px var(--mono);letter-spacing:.14em;padding:2px 10px;text-transform:uppercase;white-space:nowrap}
.center{grid-column:2;grid-row:3;display:flex;flex-direction:column;min-height:0}
.reqbar{grid-column:2;grid-row:4}
.side{grid-column:3;grid-row:2/5;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.hud-frame{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);pointer-events:none}
.hud-frame path,.rule path{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3000;stroke-dashoffset:0;vector-effect:non-scaling-stroke}

/* Panel con esquinas recortadas y línea fina */
.panel,.card,.btn{position:relative;isolation:isolate;clip-path:var(--shape)}
.panel{background:var(--panel);backdrop-filter:blur(3px)}
.card{--cut:10px;background:var(--panel-2)}
.panel::before,.card::before,.btn::before{content:"";position:absolute;inset:0;padding:1px;z-index:-1;pointer-events:none;background:var(--line-dim);clip-path:var(--shape);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.panel::after,.card::after,.btn::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom right,transparent calc(50% - .7px),var(--line-dim) calc(50% - .7px) calc(50% + .7px),transparent calc(50% + .7px)) top left/var(--cut) var(--cut) no-repeat,
  linear-gradient(to bottom right,transparent calc(50% - .7px),var(--line-dim) calc(50% - .7px) calc(50% + .7px),transparent calc(50% + .7px)) bottom right/var(--cut) var(--cut) no-repeat}
.panel{--cut:16px}

/* Barra superior */
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;min-height:58px}
.topbar h2{font-size:17px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.topbar h2:focus{outline:none}
.topbar .meta{color:var(--dim);font-size:13px}
.topbar .spacer{flex:1}
.sim{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--warn);color:var(--warn);padding:3px 10px;font:700 12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.sim i{width:8px;height:8px;background:var(--warn);border-radius:50%;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.rule{position:absolute;left:18px;right:18px;bottom:0;height:2px;pointer-events:none}

/* Botones */
.btn{min-height:40px;padding:9px 20px;border:0;background:rgba(13,54,102,.95);color:var(--text);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;--cut:9px}
.btn:hover{background:rgba(22,86,148,.98)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:-5px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:#7aeaff}
.btn-primary:focus-visible{outline-color:var(--on-accent)}
.btn-danger{background:rgba(96,18,38,.96);color:#ffd9de}
.btn-danger:hover{background:rgba(130,24,52,.98)}
.btn-ghost{background:rgba(8,30,62,.9)}
.btn-sm{min-height:34px;padding:6px 14px;font-size:12px}
.close-btn{min-width:44px;min-height:44px;padding:8px 14px}

/* Riel hexagonal */
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px}
.rail-title{font:700 11px var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.tab{position:relative;display:grid;justify-items:center;gap:5px;width:100%;padding:6px 2px;background:none;border:0;color:var(--dim);font-weight:600;font-size:12px;cursor:pointer;text-align:center}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.hex{position:relative;isolation:isolate;display:grid;place-items:center;width:52px;height:58px;background:var(--line);clip-path:var(--hex);font:700 16px var(--mono);color:var(--accent);transition:background .15s}
.hex::before{content:"";position:absolute;inset:1.5px;z-index:-1;background:var(--solid);clip-path:var(--hex);transition:background .15s}
.tab:hover .hex::before{background:#0d3566}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"] .hex{background:var(--accent);color:var(--on-accent)}
.tab[aria-selected="true"] .hex::before{background:var(--accent)}
.cnt{position:absolute;top:0;right:8px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;background:var(--warn);color:#2a1d00;font:700 12px var(--mono);border-radius:3px}

/* Módulos */
.tabpanel{flex:1;min-height:0;overflow:auto;padding:20px 22px;scrollbar-color:var(--line) transparent}
.tabpanel:focus-visible{outline:2px solid var(--focus);outline-offset:-4px}
.mod-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.mod-head .num{font:700 30px/1 var(--mono);color:var(--accent)}
.mod-head h3{font-size:20px;letter-spacing:.04em}
.mod-head p{color:var(--dim);font-size:13px}
.mod-head .grow{flex:1;min-width:200px}
.mod-head h3:focus{outline:none}
.grid{display:grid;gap:12px}
.grid.cols{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{padding:14px 16px}
.card h4{font-size:15px;display:flex;gap:10px;align-items:baseline}
.card .n{font:700 13px var(--mono);color:var(--accent)}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{min-height:34px;padding:5px 14px;border:1px solid var(--line-dim);background:rgba(8,30,62,.9);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;border-radius:2px}
.chip:hover{background:rgba(22,86,148,.9)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border:1px solid currentColor;background:rgba(0,0,0,.28);font-size:12px;font-weight:600;white-space:nowrap;color:var(--dim)}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-info{color:var(--info)}.t-acc{color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.tasks{margin-top:10px;border-top:1px solid var(--line-dim);padding-top:8px}
.tasks li{display:block;padding:5px 0;font-size:13px}
.code{white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0}
.kv dt{color:var(--dim)}.kv dd{margin:0}
.area-card{display:flex;flex-direction:column;gap:8px}
.spark{display:block;width:100%;height:30px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark path{fill:rgba(53,224,255,.14);stroke:none}
.back{margin-bottom:12px}

/* Checklist */
.progress{height:8px;background:rgba(47,212,245,.18);margin:6px 0 16px;position:relative;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .3s var(--ease)}
.group-title{font:700 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.check{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;min-width:0}
.check>*{min-width:0;overflow-wrap:anywhere}

/* Árbol */
.tree,.tree ul{list-style:none}
.tree ul{margin:8px 0 0 18px;padding-left:14px;border-left:1px solid var(--line-dim)}
.tree li{margin:6px 0}
.node{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:rgba(10,34,70,.9);border:1px solid var(--line-dim)}
.node .ttl{flex:1;min-width:160px}
.toggle{width:30px;height:30px;display:grid;place-items:center;background:none;border:1px solid var(--line-dim);color:var(--accent);cursor:pointer;font-weight:700}
.toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* Aprobaciones */
.run{padding:14px 16px}
.params{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:6px 0 10px}
.params b{color:var(--text);font-weight:600}
.note-label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
textarea,.input,select{width:100%;background:#041126;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:2px;resize:vertical}
textarea::placeholder,.input::placeholder{color:#a8c8dd;opacity:1}
select{resize:none;min-height:40px}
select:focus-visible,.input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--dim)}
.err{color:var(--bad);font-size:13px}
textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.run .actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line-dim)}
.empty:focus{outline:none}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid rgba(47,212,245,.18)}
.hist .sub{grid-column:1/-1;font-size:13px;color:var(--dim)}

/* Gauges */
.side .panel{padding:14px 16px}
.side h3{font:700 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.gauges{display:grid;gap:12px}
.gauges li{display:flex;gap:14px;align-items:center}
.gauge{position:relative;width:76px;height:76px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{fill:none;stroke:rgba(47,212,245,.22);stroke-width:6}
.gauge .arc{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:butt;transition:stroke-dashoffset .6s var(--ease)}
.gauge .ticks{fill:none;stroke:var(--line-dim);stroke-width:2;stroke-dasharray:1.5 5.5}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--mono)}
.g-lab{font-weight:700;font-size:14px}
.g-sub{font-size:13px;color:var(--dim)}

/* Barra de solicitud */
.reqbar{padding:10px 14px}
.reqbar{display:flex;gap:12px;align-items:flex-end}
.reqbar textarea{height:44px;min-height:44px;resize:none}
.reqbar label{display:block;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}

/* Animaciones de ensamblado */
.hud[data-state="opening"] .panel{animation:panelIn .6s var(--ease) both;animation-delay:calc(var(--i)*80ms)}
.hud[data-state="opening"] .hud-frame path,.hud[data-state="opening"] .rule path{animation:draw .9s var(--ease) both;animation-delay:.25s}
.hud[data-state="opening"]{animation:veil .5s ease both}
.hud[data-state="closing"] .panel{animation:panelOut .28s ease-in both;animation-delay:calc((4 - var(--i))*40ms)}
.hud[data-state="closing"]{animation:veil .46s ease reverse both}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes panelOut{to{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes draw{from{stroke-dashoffset:3000}to{stroke-dashoffset:0}}
@keyframes veil{from{background-color:transparent;opacity:.0}to{opacity:1}}

/* Movimiento reducido: sin dolly, sin dibujo de líneas, sin pulsos; fundido <=150 ms */
html.rm .scene-wrap{transition:none}
html.rm .ceo-btn .pulse,html.rm .sim i{animation:none}
html.rm .hud .panel,html.rm .hud .hud-frame path,html.rm .hud .rule path{animation:none!important}
html.rm .hud[data-state]{animation:rmfade .12s linear both!important}
html.rm .gauge .arc,html.rm .progress i{transition:none}
@keyframes rmfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .scene-wrap{transition:none}
  .ceo-btn .pulse,.sim i{animation:none}
  .hud .panel,.hud .hud-frame path,.hud .rule path{animation:none!important}
  .hud[data-state]{animation:rmfade .12s linear both!important}
  .gauge .arc,.progress i{transition:none}
}

/* Móvil: riel como barra inferior, gauges apilados sobre el módulo */
@media (max-width:860px){
  .hud{display:flex;flex-direction:column;gap:10px;padding:8px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .hud>*{flex-shrink:0}
  .window{display:none}
  .topbar{order:0;flex-wrap:wrap;gap:8px;padding:8px 12px;min-height:0;position:sticky;top:0;z-index:3}
  .topbar .meta{display:none}
  .topbar h2{font-size:14px}
  .side{order:1;overflow:visible;flex:none}
  .center{order:2;flex:none}
  .tabpanel{overflow:visible;padding:14px 12px}
  .reqbar{order:3}
  .rail{order:4;flex-direction:row;justify-content:space-around;gap:0;padding:6px 2px;position:sticky;bottom:0;z-index:3}
  .rail-title{display:none}
  .tab{width:auto;flex:1;min-width:0;padding:4px 0}
  .hex{width:40px;height:45px;font-size:14px}
  .cnt{right:50%;margin-right:-26px}
  .gauges{grid-template-columns:1fr 1fr}
  .gauges li{gap:8px}
  .gauge{width:52px;height:52px}
  .gauge .val{font-size:15px}
  .g-lab{font-size:13px;line-height:1.2}.g-sub{font-size:12px}
  .side .panel{padding:10px 12px}
  .spark-panel{display:none}
  .reqbar{flex-direction:column;align-items:stretch}
  .btn{min-height:44px}
  .chip{min-height:40px}
  .demo-bar{font-size:12px}
  body.dolly .scene-wrap{transform:scale(.72) translateY(-3%)}
}
@media (max-width:360px){
  .tab{font-size:11px}
  .hex{width:34px;height:38px;font-size:12px}
  .cnt{margin-right:-20px}
  .gauges{grid-template-columns:1fr}
  .topbar h2{font-size:13px;letter-spacing:.06em}
  .tabpanel{padding:12px 8px}
  .btn{padding:8px 12px}
  .grid.cols{grid-template-columns:1fr}
}

/* Colores forzados (Windows Alto Contraste) */
@media (forced-colors:active){
  .hud{background:Canvas}
  .panel,.card,.btn{clip-path:none;border:1px solid CanvasText;background:Canvas}
  .panel::before,.panel::after,.card::before,.card::after,.btn::before,.btn::after,.hex::before{display:none}
  .hex{clip-path:none;background:Canvas;border:2px solid CanvasText;border-radius:8px}
  .tab[aria-selected="true"] .hex{background:Highlight;color:HighlightText;border-color:Highlight;forced-color-adjust:none}
  .tab[aria-selected="true"]{outline:2px solid Highlight}
  .chip[aria-pressed="true"]{background:Highlight;color:HighlightText;forced-color-adjust:none}
  .btn-primary{background:ButtonFace;color:ButtonText;border:2px solid Highlight}
  .gauge .trk{stroke:GrayText}.gauge .arc{stroke:Highlight}.gauge .ticks{stroke:CanvasText}
  .progress{background:Canvas;border:1px solid CanvasText;clip-path:none}.progress i{background:Highlight}
  .hud-frame path,.rule path{stroke:CanvasText}
  .spark polyline{stroke:CanvasText}.spark path{fill:none}
  .badge,.sim{border:1px solid CanvasText;color:CanvasText}
  .cnt{background:Highlight;color:HighlightText;forced-color-adjust:none}
  .dot{forced-color-adjust:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="demo-bar">
    <strong>PROTOTIPO H-01</strong>
    <span>Oficina simulada · pulsa al CEO para abrir el centro de mando</span>
    <label><input type="checkbox" id="rmSwitch" role="switch"> Movimiento reducido (simulado)</label>
  </header>
  <main class="scene-wrap" id="sceneWrap">

    var a=P(f,gx,gy,z0+h),b=P(f,gx+w,gy,z0+h),c=P(f,gx+w,gy+d,z0+h),e=P(f,gx,gy+d,z0+h);
    var bb=P(f,gx+w,gy,z0),cc=P(f,gx+w,gy+d,z0),ee=P(f,gx,gy+d,z0);
    return '<polygon points="'+pts([e,c,cc,ee])+'" fill="'+l+'"/><polygon points="'+pts([c,b,bb,cc])+'" fill="'+r+'"/><polygon points="'+pts([a,b,c,e])+'" fill="'+top+'" stroke="rgba(120,220,255,.35)" stroke-width="1"/>';
  }
  function grid(f){var o='<g stroke="rgba(120,220,255,.14)" stroke-width="1">';for(var i=1;i<f.n;i++){var a=P(f,i,0),b=P(f,i,f.n),c=P(f,0,i),d=P(f,f.n,i);o+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/><line x1="'+c[0]+'" y1="'+c[1]+'" x2="'+d[0]+'" y2="'+d[1]+'"/>';}return o+'</g>';}
  function slab(f){return box(f,0,0,f.n,f.n,16,-16,'#0f2e57','#0a2144','#071a37').replace('stroke="rgba(120,220,255,.35)"','stroke="rgba(120,220,255,.7)"')+grid(f);}
  function person(f,gx,gy,color){var p=P(f,gx,gy,14);return '<ellipse cx="'+p[0]+'" cy="'+(p[1]+14)+'" rx="13" ry="5" fill="rgba(0,0,0,.35)"/><path d="M'+(p[0]-10)+' '+(p[1]+12)+' v-16 q0-9 10-9 q10 0 10 9 v16z" fill="'+color+'" stroke="rgba(232,247,255,.8)" stroke-width="1.2"/><circle cx="'+p[0]+'" cy="'+(p[1]-20)+'" r="8" fill="#f0d3b6" stroke="rgba(232,247,255,.8)" stroke-width="1.2"/>';}
  function desk(f,gx,gy,color,big){var w=big?2:1.4,d=big?1.1:.9;return box(f,gx,gy,w,d,16,0,'#1c4a82','#123861','#0d2d52')+box(f,gx+w*.35,gy+.1,.5,.12,14,16,color,'#16335c','#16335c');}
  var up={cx:600,cy:285,n:6}, lo={cx:600,cy:500,n:8};
  s.push('<defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1d6fb8" stop-opacity=".55"/><stop offset="1" stop-color="#1d6fb8" stop-opacity="0"/></radialGradient></defs>');
  s.push('<ellipse cx="600" cy="520" rx="560" ry="230" fill="url(#glow)"/>');
  s.push(slab(lo));
  [['soporte',1,1],['contabilidad',4.4,1],['rrhh',1,4.6],['operaciones',4.6,4.6]].map(function(o){return [lo,o[1],o[2],agent(o[0]).c,1]}).sort(function(a,b){return a[1]+a[2]-b[1]-b[2]}).forEach(function(i){s.push(desk(i[0],i[1],i[2],i[3]));s.push(person(i[0],i[1]+.55,i[2]-.25,i[3]));});
  [[360,300],[840,300],[600,420]].forEach(function(c){s.push('<rect x="'+(c[0]-6)+'" y="'+c[1]+'" width="12" height="200" fill="rgba(40,110,180,.55)" stroke="rgba(120,220,255,.5)"/>');});
  s.push(slab(up));
  [['ventas',.6,.6],['marketing',3.6,.6],['proyectos',.6,3.6],['ceo',2.5,2.5],['comunicaciones',3.9,3.9]].sort(function(a,b){return a[1]+a[2]-b[1]-b[2]}).forEach(function(o){var c=agent(o[0]).c;s.push(desk(up,o[1],o[2],c,o[0]==='ceo'));if(o[0]!=='ceo')s.push(person(up,o[1]+.55,o[2]-.25,c));});

/* ===== Métricas ===== */
function metrics(){
  var tot=TASKS.length, act=TASKS.filter(function(t){return ['queued','planning','running','waiting_approval'].indexOf(t.s)>=0}).length;
  var done=TASKS.filter(function(t){return t.s==='completed'}).length;
  var pend=RUNS.filter(function(r){return r.s==='pending_approval'}).length;
  return {tot:tot,act:act,done:done,pend:pend,runs:RUNS.length,resolved:RUNS.length-pend,pct:Math.round(done*100/tot)};
}
var P0=RUNS.filter(function(r){return r.s==='pending_approval'}).length;
function buildGauges(){
  var C=2*Math.PI*30;
  var defs=[['act','Tareas activas'],['pend','Aprobaciones pendientes'],['runs','Ejecuciones de hoy'],['pct','% completado']];
  $('#gauges').innerHTML=defs.map(function(d){return '<li><div class="gauge"><svg viewBox="0 0 76 76" aria-hidden="true" focusable="false"><circle class="ticks" cx="38" cy="38" r="36"/><circle class="trk" cx="38" cy="38" r="30"/><circle class="arc" id="arc-'+d[0]+'" cx="38" cy="38" r="30" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+C.toFixed(2)+'"/></svg><span class="val" id="val-'+d[0]+'" aria-hidden="true"></span></div><div><div class="g-lab">'+d[1]+'</div><div class="g-sub" id="sub-'+d[0]+'"></div></div></li>';}).join('');
  var pts=SPARK.map(function(v,i){return (i*120/(SPARK.length-1)).toFixed(1)+','+(28-v*2.8).toFixed(1)});
  $('#spark').innerHTML='<path d="M0,30 L'+pts.join(' L')+' L120,30z"/><polyline points="'+pts.join(' ')+'"/>';
  $('#sparkTxt').textContent='Pico de '+Math.max.apply(null,SPARK)+' ejecuciones por hora a las 10:00; tendencia estable en las últimas 12 horas.';
  updateGauges();
}
function updateGauges(){
  var m=metrics(),C=2*Math.PI*30;
  var set=function(k,val,ratio,sub){$('#val-'+k).textContent=val;$('#arc-'+k).style.strokeDashoffset=(C*(1-Math.max(0,Math.min(1,ratio)))).toFixed(2);$('#sub-'+k).textContent=sub;};
  set('act',m.act,m.act/m.tot,m.act+' de '+m.tot+' tareas');
  set('pend',m.pend,m.pend/Math.max(P0,m.pend,1),m.pend===0?'Bandeja vacía':(m.pend===1?'1 espera tu decisión':m.pend+' esperan tu decisión'));
  set('runs',m.runs,m.resolved/m.runs,m.resolved+' de '+m.runs+' resueltas');
  set('pct',m.pct+'%',m.pct/100,m.done+' de '+m.tot+' tareas completadas');
  var c=$('#cnt-5');if(c){c.textContent=m.pend;c.hidden=m.pend===0;}
  var t5=$('#cnt-5t');if(t5)t5.textContent=m.pend?m.pend+(m.pend===1?' pendiente':' pendientes'):'';
}

   '<div class="card"><dl class="kv"><dt>Clave del agente</dt><dd><code>'+g.k+'</code></dd><dt>Área</dt><dd>'+esc(ar?ar.n:'Sin área')+(g.area?'':' <span class="badge t-warn">Sin área</span>')+'</dd><dt>Rol</dt><dd>'+g.role+(g.k==='comunicaciones'?' · reporta a Lumen (<code>marketing</code>)':'')+'</dd><dt>Estado</dt><dd>'+(g.en?badge(AG_ST,g.st):'<span class="badge">Deshabilitado</span>')+'</dd><dt>Modelo</dt><dd>'+g.model+' (por defecto)</dd></dl><p>'+esc(g.d)+'</p></div>'+
   '<div class="mod-head" style="margin-top:20px"><div class="grow"><h4 class="sec-title" style="margin:0">Acciones ('+g.acts.length+')</h4></div><button type="button" class="btn btn-primary btn-sm" id="newAction">Nueva acción</button></div>'+
   (g.acts.length?'<ul class="grid">'+g.acts.map(function(x){return '<li class="card"><div class="row between"><strong>'+esc(x.n)+'</strong><span class="row">'+(x.lock?'<span class="badge lock"><span aria-hidden="true">🔒</span>Requiere aprobación</span>':'')+(x.pol?'<span class="badge t-info">Política '+x.pol+'</span>':'')+'<span class="badge">'+SE[x.se]+'</span>'+(x.en?'':'<span class="badge">Deshabilitada</span>')+'</span></div><p class="small muted"><code>'+x.k+'</code></p><div class="row" style="margin-top:8px"><button type="button" class="btn btn-sm btn-ghost" data-edit="'+esc(x.n)+'" aria-label="Editar acción '+esc(x.n)+'">Editar</button><button type="button" class="btn btn-sm btn-ghost" data-del="'+esc(x.n)+'" aria-label="Borrar acción '+esc(x.n)+'">Borrar</button></div></li>';}).join('')+'</ul>':'<p class="empty">'+(g.k==='ceo'?'El CEO no tiene acciones propias: planifica, delega y sintetiza.':'Este agente no tiene acciones.')+'</p>')+
   '<h4 class="sec-title">Actividad reciente</h4><ul class="hist">'+(tasks.length||runs.length?tasks.map(function(t){return '<li><span>'+esc(t.t)+'</span>'+badge(T_ST,t.s)+'</li>';}).join('')+runs.map(function(r){return '<li><span>Ejecución: '+esc(r.n)+'</span>'+badge(R_ST,r.s)+'</li>';}).join(''):'<li><span class="muted">Sin actividad hoy.</span></li>')+'</ul>';
  $('#backBtn').onclick=function(){var k=av.agent,a=g.area;av.agent=null;renderAreas();var b=$('[data-ag="'+k+'"]');(b||$('#h-1')).focus();announce(a?'Volviste al área.':'Volviste a las áreas.');};
  $('#editAgent').onclick=function(){stub('editar a '+g.n);};
  $('#delAgent').onclick=function(){stub('confirmar el borrado de '+g.n);};
  $('#togAgent').onclick=function(){g.en=g.en?0:1;renderAreas();$('#togAgent').focus();announce(g.n+(g.en?' habilitado.':' deshabilitado.'));};
  $('#newAction').onclick=function(){stub('crear una acción para '+g.n);};
  $$('[data-edit]',el).forEach(function(b){b.onclick=function(){stub('editar la acción '+b.dataset.edit);};});
  $$('[data-del]',el).forEach(function(b){b.onclick=function(){stub('confirmar el borrado de la acción '+b.dataset.del);};});
}

/* 03 Mi día: agenda calculada (AgendaResponse, estados AgendaStatus) */
function renderDay(){
  var el=$('#panel-2'),m=metrics(),ceoL=AGENDA.filter(function(a){return a.sec==='ceo'}),done=ceoL.filter(function(a){return a.s==='done'||a.s==='skipped'}).length;
  function btns(a){var o='';if(a.s==='due'||a.s==='missed')o+='<button type="button" class="btn btn-sm btn-ghost" data-run="'+a.id+'" aria-label="Lanzar ahora '+esc(a.t)+' '+(a.code||a.id)+'">Lanzar ahora</button>';if(a.s==='failed')o+='<button type="button" class="btn btn-sm btn-ghost" data-run="'+a.id+'" aria-label="Relanzar '+esc(a.t)+' '+(a.code||a.id)+'">Relanzar</button>';if(a.sec==='late')o+='<button type="button" class="btn btn-sm btn-ghost" data-skip="'+a.id+'" aria-label="Omitir '+esc(a.t)+' '+(a.code||a.id)+'">Omitir</button>';return o;}
  function row(a,i,n){return '<li class="card check">'+(n?'<span class="n t-acc" style="font:700 13px var(--mono)">'+String(i+1).padStart(2,'0')+'</span>':'')+'<span style="flex:1 1 220px"><strong>'+esc(a.t)+'</strong><span class="small muted"> · <span class="code">'+(a.code||a.id)+'</span> · '+a.h+' · '+(a.m==='auto'?'automática':'manual')+(a.who?' · '+a.who:'')+'</span></span>'+badge(AG_ST2,a.s)+btns(a)+'</li>';}
  var late=AGENDA.filter(function(a){return a.sec==='late'}),oth=AGENDA.filter(function(a){return a.sec==='areas'});
  el.innerHTML=head(2,'Agenda del CEO: las rutinas R-DIR del día con su estado. Las automáticas las lanza el programador; las manuales, tú. Hora simulada: '+NOW+'.')+
   '<div class="small" id="dayTxt">'+done+' de '+ceoL.length+' rutinas del CEO resueltas</div><div class="progress" aria-hidden="true"><i id="dayBar" style="width:'+(done*100/ceoL.length)+'%"></i></div>'+
   '<h4 class="group-title">Rutina de hoy (R-DIR)</h4><ul class="grid">'+ceoL.map(function(a,i){return row(a,i,1)}).join('')+'</ul>'+
   '<h4 class="group-title">Manuales y fallidas de las áreas, hoy</h4><ul class="grid">'+oth.map(function(a){return row(a)}).join('')+'</ul>'+
   '<h4 class="group-title">Atrasadas (días anteriores)</h4>'+(late.length?'<ul class="grid">'+late.map(function(a){return row(a)}).join('')+'</ul>':'<p class="empty">No hay tareas atrasadas.</p>')+
   '<h4 class="group-title">Ejecuciones</h4><ul class="grid"><li class="card check"><span style="flex:1 1 200px">Aprobar ejecuciones pendientes: <strong id="dayPend">'+m.pend+'</strong></span><button type="button" class="btn btn-sm btn-primary" id="goRuns">Ir a aprobaciones</button></li></ul>';
  $$('[data-run]',el).forEach(function(b){b.onclick=function(){var a=AGENDA.filter(function(x){return x.id===b.dataset.run})[0],was=a.s;a.s='running';renderDay();$('#h-2').focus();announce((was==='failed'?'Relanzada: ':'Lanzada: ')+a.t+' ('+(a.code||a.id)+'). Estado: en curso.');};});
  $$('[data-skip]',el).forEach(function(b){b.onclick=function(){var a=AGENDA.filter(function(x){return x.id===b.dataset.skip})[0];a.s='skipped';renderDay();$('#h-2').focus();announce('Omitida: '+a.t+' ('+(a.code||a.id)+').');};});
  $('#goRuns').onclick=function(){selectTab(4,true);};
}

/* 04 Tareas de los agentes */
function renderTasks(){
  var el=$('#panel-3'),roots=TASKS.filter(function(t){return !t.p});
  el.innerHTML=head(3,'Cada solicitud o rutina del CEO y las subtareas delegadas a los agentes, con su estado.')+
   '<div class="legend" role="group" aria-label="Leyenda de estados">'+Object.keys(T_ST).map(function(k){return badge(T_ST,k)}).join('')+'</div>'+
   '<ul class="tree">'+roots.map(function(r,i){
     var ch=TASKS.filter(function(t){return t.p===r.id});
     return '<li><div class="node"><button type="button" class="toggle" data-id="'+r.id+'" aria-expanded="'+!!expanded[r.id]+'" aria-controls="sub-'+r.id+'" aria-label="Subtareas de '+esc(r.t)+'"><span aria-hidden="true">'+(expanded[r.id]?'−':'+')+'</span></button><span class="n t-acc" style="font:700 13px var(--mono)">'+String(i+1).padStart(2,'0')+'</span><strong class="ttl">'+esc(r.t)+'</strong><span class="small muted">'+(r.o==='recurring'?'recurrente':'solicitud')+(r.u?' · contexto no confiable':'')+' · '+ch.length+' subtareas</span>'+badge(T_ST,r.s)+'</div>'+
      '<ul id="sub-'+r.id+'"'+(expanded[r.id]?'':' hidden')+'>'+ch.map(function(c){var a=agent(c.a),rr=RUNS.filter(function(x){return x.tk===c.id});return '<li><div class="node">'+dot(a.c)+'<span class="ttl">'+esc(c.t)+'<span class="small muted"> · '+esc(a.n)+'</span>'+(rr.length?'<span class="small muted"> · '+rr.map(function(x){return esc(x.n)+': '+R_ST[x.s][0].toLowerCase()}).join('; ')+'</span>':'')+'</span>'+badge(T_ST,c.s)+'</div></li>';}).join('')+'</ul></li>';}).join('')+'</ul>';
  $$('.toggle',el).forEach(function(b){b.onclick=function(){var id=b.dataset.id;expanded[id]=!expanded[id];b.setAttribute('aria-expanded',!!expanded[id]);b.firstChild.textContent=expanded[id]?'−':'+';$('#sub-'+id).hidden=!expanded[id];};});
}

/* 05 Ejecuciones y aprobaciones (ApprovalPolicy, requireNote, approvalSource, urgencia) */
function srcText(r){return r.as==='policy'?'Pide aprobación la política '+r.pol+'.':(r.as==='untrusted_input'?'Pide aprobación por entrada no confiable (origen: '+esc(r.src)+').':'La acción exige aprobación'+(r.pol?'; además aplica la política '+r.pol+'.':'.'));}
function renderRuns(){
  var el=$('#panel-4'),pend=RUNS.filter(function(r){return r.s==='pending_approval'}).sort(function(a,b){return (b.urg-a.urg)||(b.hw-a.hw)}),hist=RUNS.filter(function(r){return r.s!=='pending_approval'}).sort(function(a,b){return b.at<a.at?-1:1});
  el.innerHTML=head(4,'Bandeja de aprobaciones (urgentes primero) e historial de ejecuciones de hoy.')+
   '<h4 class="group-title" id="inboxT" tabindex="-1" style="margin-top:0">Bandeja · '+pend.length+(pend.length===1?' pendiente':' pendientes')+'</h4>'+
   (pend.length?'<ul class="grid">'+pend.map(function(r,i){var a=agent(r.a);return '<li class="card run" data-id="'+r.id+'"><h4><span class="n">'+String(i+1).padStart(2,'0')+'</span><span id="rt-'+r.id+'">'+esc(r.n)+'</span>'+(r.urg?'<span class="badge t-bad"><span aria-hidden="true">!</span>Urgente</span>':'')+'</h4><div class="row small muted">'+dot(a.c)+esc(a.n)+' · '+esc(area(a.area).n)+' · solicitada a las '+r.at+' · '+r.hw+(r.hw===1?' hora hábil':' horas hábiles')+' esperando</div><div class="params">'+Object.keys(r.pr).map(function(k){return '<span>'+esc(k)+': <b>'+esc(r.pr[k])+'</b></span>';}).join('')+'</div><p class="small muted">'+srcText(r)+'</p><label class="note-label" for="note-'+r.id+'" style="margin-top:8px">'+(r.rn?'Nota (obligatoria para aprobar, política '+r.pol+')':'Nota (opcional)')+'</label><textarea id="note-'+r.id+'" rows="2" placeholder="Se la entregamos al agente"'+(r.rn?' aria-required="true"':'')+' aria-describedby="err-'+r.id+'"></textarea><p class="small t-bad" id="err-'+r.id+'" hidden>Esta ejecución exige una nota para aprobarla (la API respondería 400). Puedes rechazar sin nota.</p><div class="actions"><button type="button" class="btn btn-primary btn-sm" data-ok="'+r.id+'" aria-label="Aprobar '+esc(r.n)+' de '+esc(r.pr.Cliente||r.pr.Persona||a.n)+'">Aprobar</button><button type="button" class="btn btn-danger btn-sm" data-no="'+r.id+'" aria-label="Rechazar '+esc(r.n)+' de '+esc(r.pr.Cliente||r.pr.Persona||a.n)+'">Rechazar</button></div></li>';}).join('')+'</ul>':'<p class="empty" id="emptyInbox" tabindex="-1">No hay ejecuciones pendientes. Buen trabajo.</p>')+
   '<h4 class="group-title">Historial de hoy</h4><ul class="hist">'+hist.map(function(r){return '<li><span><strong>'+esc(r.n)+'</strong> · '+esc(agent(r.a).n)+' · '+r.at+'</span>'+badge(R_ST,r.s)+(r.err?'<span class="sub">Error: '+esc(r.err)+'</span>':'')+(r.note?'<span class="sub note-row">Nota: '+esc(r.note)+'</span>':'')+'</li>';}).join('')+'</ul>';
  $$('textarea',el).forEach(function(t){if(drafts[t.id])t.value=drafts[t.id];});
  $$('[data-ok]',el).forEach(function(b){b.onclick=function(){resolve(b.dataset.ok,true);};});
  $$('[data-no]',el).forEach(function(b){b.onclick=function(){resolve(b.dataset.no,false);};});
}
function resolve(id,ok){
  var r=RUNS.filter(function(x){return x.id===id})[0],ta=$('#note-'+id),note=ta.value.trim(),idx=RUNS.filter(function(x){return x.s==='pending_approval'}).indexOf(r);
  if(ok&&r.rn&&!note){$('#err-'+id).hidden=false;ta.setAttribute('aria-invalid','true');ta.focus();announce('No se puede aprobar sin nota: la política '+r.pol+' la exige.');return;}
  r.s=ok?'succeeded':'rejected';r.note=note;r.at=NOW;delete drafts['note-'+id];
  var t=TASKS.filter(function(x){return x.id===r.tk})[0];if(t)t.s=ok?'completed':'failed';
  var ag=agent(r.a);if(ag&&!RUNS.some(function(x){return x.a===r.a&&x.s==='pending_approval'})&&ag.st==='waiting_approval')ag.st=ok?'working':'idle';
  renderRuns();updateGauges();
  var m=metrics(),left=$$('#panel-4 .run');
  if(left.length){$('textarea',left[Math.min(idx,left.length-1)]).focus();}else{$('#emptyInbox').focus();}
  announce((ok?'Aprobada: ':'Rechazada: ')+r.n+(note?' con nota.':'.')+' Quedan '+m.pend+(m.pend===1?' aprobación pendiente.':' aprobaciones pendientes.'));
}
hud.addEventListener('input',function(e){var t=e.target;if(t.tagName==='TEXTAREA'&&t.id.indexOf('note-')===0){drafts[t.id]=t.value;if(t.value.trim()){var er=$('#err-'+t.id.slice(5));if(er)er.hidden=true;t.removeAttribute('aria-invalid');}}});

/* ===== Solicitud al CEO ===== */
var rq=$('#reqText');
$('#reqForm').addEventListener('submit',function(e){
  e.preventDefault();var v=rq.value.trim();if(!v)return;
  TASKS.push({id:'n'+TASKS.length,p:null,a:'ceo',t:v,s:'planning',o:'request'});rq.value='';updateGauges();
  if(active===3)renderTasks();
  announce('Solicitud enviada al CEO: '+v+'. Aparece en Tareas de los agentes.');
});
rq.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#reqForm').requestSubmit();}});

/* ===== Abrir / cerrar con transición ===== */
function open(){
  if(state!=='closed')return;
  state='dolly';trigger=ceo;app.inert=true;
  var rm=reduced();
  if(rm)show(rm);else{document.body.classList.add('dolly');T(function(){show(rm);},780);}
}
function show(rm){
  state='opening';document.body.classList.add('hud-open');hud.hidden=false;hud.dataset.state='opening';
  selectTab(active,false,true);
  $('#tab-'+active).focus({preventScroll:true});
  announce('Centro de mando abierto. Módulo '+(active+1)+' de 5: '+MODS[active][2]+'. Usa las flechas para cambiar de módulo y Escape para cerrar.');
  T(function(){state='open';hud.dataset.state='open';},rm?130:1000);
}
function close(){
  if(state!=='open'&&state!=='opening')return;
  var rm=reduced();state='closing';timers.forEach(clearTimeout);timers=[];hud.dataset.state='closing';
  if(rm)finish();else T(finish,470);
}
function finish(){
  var kept=Object.keys(drafts).some(function(k){return drafts[k].trim()})||rq.value.trim();
  hud.hidden=true;hud.dataset.state='closed';app.inert=false;state='closed';
  document.body.classList.remove('dolly','hud-open');
  (trigger||ceo).focus({preventScroll:true});
  announce('Centro de mando cerrado. Volviste a la oficina.'+(kept?' Se conservaron tus borradores.':''),true);
}
ceo.addEventListener('click',open);
$('#closeBtn').addEventListener('click',close);

hud.addEventListener('keydown',function(e){
  if(e.key==='Escape'){e.preventDefault();close();return;}
  if(e.key==='Tab'){
    var f=$$('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex="0"]',hud).filter(function(x){return x.getClientRects().length&&!x.closest('[hidden]')});
    if(!f.length)return;var first=f[0],last=f[f.length-1],cur=document.activeElement;
    if(e.shiftKey&&(cur===first||!hud.contains(cur))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(cur===last||!hud.contains(cur))){e.preventDefault();first.focus();}
    return;
  }
  /* Atajos 1-5 (WCAG 2.1.4): solo con el foco en el riel o en el módulo, y nunca al escribir en un campo */
  var tg=e.target,editable=/^(TEXTAREA|SELECT|INPUT)$/.test(tg.tagName)||tg.isContentEditable;
  if(!editable&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1-5]$/.test(e.key)&&tg.closest('#tablist,.tabpanel')){e.preventDefault();selectTab(+e.key-1,true);}
});
$('#tablist').addEventListener('keydown',function(e){
  var k=e.key,n=MODS.length,i=active,to=null;
  if(k==='ArrowDown'||k==='ArrowRight')to=(i+1)%n;
  else if(k==='ArrowUp'||k==='ArrowLeft')to=(i-1+n)%n;
  else if(k==='Home')to=0;else if(k==='End')to=n-1;
  if(to!==null){e.preventDefault();selectTab(to,true);}
});
$('#tablist').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)selectTab(+b.id.slice(4),true);});
var mqM=window.matchMedia('(max-width:860px)');
function orient(){$('#tablist').setAttribute('aria-orientation',mqM.matches?'horizontal':'vertical');}
orient();mqM.addEventListener&&mqM.addEventListener('change',orient);

$('#hudDate').textContent='martes 24 de noviembre de 2026 · 13:10 (fecha simulada)';
buildTabs();buildGauges();selectTab(0,false,true);
})();
</script>
</body>
